name: Build and Release WinForms

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore Packages
      run: nuget restore InventoryManagement.sln

    - name: Build Application
      run: |
        msbuild InventoryManagement.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="${{ github.workspace }}\build_output"

    - name: Create Zip Package
      shell: powershell
      run: |
        Compress-Archive -Path "${{ github.workspace }}\build_output\*" -DestinationPath AppRelease.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: AppRelease.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}